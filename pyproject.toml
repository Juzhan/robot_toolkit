[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-toolkit"
version = "0.1.0"
description = "Robot-agnostic toolkit for teleoperation, teaching, data collection and calibration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "robot_toolkit contributors" },
    { name = "DeepSeek" },
]
keywords = ["robotics", "teleoperation", "teaching", "calibration", "imitation-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8,<5", "scipy>=1.10"]
reconstruction = ["open3d>=0.19,<0.20"]
control = ["ruckig>=0.12"]
# UR3/UR5/UR10 (CB3 and e-Series) over RTDE.  Prebuilt wheels exist for
# cp39-cp314 on Windows, Linux and macOS; no UR SDK, URCap or ROS install needed.
ur = ["ur_rtde>=1.6,<2"]
# RealSense RGB-D capture.  Includes OpenCV so USB cameras work from the same extra.
cameras = ["pyrealsense2>=2.54", "opencv-python>=4.8,<5"]
# HTTP agent surface: python -m robot_toolkit.agent.uni
server = ["fastapi>=0.110", "uvicorn>=0.29"]
# Robotiq over Modbus (tool_modbus / modbus_rtu backends).
modbus = ["pymodbus>=3.6,<4"]
# LeRobotDataset export / merge / edit.  Leave unpinned to match the dataset version.
lerobot = ["lerobot"]
# MuJoCo demos under examples/ (sim_depth_avoidance, run_try_mujoco).
sim = ["mujoco>=3.0", "Pillow>=10", "imageio>=2.31"]
dev = ["pytest>=7"]
# Joy-Con buttons/teleop; the joyconrobotics library itself is bundled in third_party.
joycon = ["hidapi>=0.14", "PyGLM>=2.7", "scipy>=1.10"]
voice = ["comtypes>=1.2 ; sys_platform == 'win32'"]
# Optional host-side IK. PyRoki is not on PyPI; install it from source.
ik = ["pyroki @ git+https://github.com/chungmin99/pyroki.git"]
piper = [
    "python-can>=4.0",
    "pyAgxArm @ git+https://github.com/agilexrobotics/pyAgxArm.git",
    "python-can-agx-cando @ git+https://github.com/agilexrobotics/python-can-agx-cando.git ; sys_platform == 'win32'",
]

[tool.setuptools]
package-dir = { "robot_toolkit" = "." }
packages = [
    "robot_toolkit",
    "robot_toolkit.adapters",
    "robot_toolkit.calibrate",
    "robot_toolkit.camera",
    "robot_toolkit.collect",
    "robot_toolkit.control",
    "robot_toolkit.core",
    "robot_toolkit.examples",
    "robot_toolkit.gripper",
    "robot_toolkit.robot",
    "robot_toolkit.teach",
    "robot_toolkit.teleop",
    "robot_toolkit.agent",
    "robot_toolkit.agent_rpc",
]

[tool.setuptools.package-data]
# Demo task configs ship with the package so `run.bat <demo>` works after install.
robot_toolkit = ["configs/tasks/*.json", "configs/external_tools.json",
                 "assets/audio/*.wav",
                 "third_party/joycon-robotics/joyconrobotics/*.py",
                 "third_party/joycon-robotics/LICENSE", "third_party/joycon-robotics/SOURCE.txt"]
